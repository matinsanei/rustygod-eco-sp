# Build, test and publish rustygod-saleor to GHCR.
#
# - `test`: PG-free checks (workspace check + unit/SDL/PSP tests with cargo caching).
# - `publish`: multi-layer-cached docker build, pushed to GHCR on master/tags.
#
# Required repo setting (one time): Settings → Actions → General →
# Workflow permissions → "Read and write permissions" (for GITHUB_TOKEN to
# push packages). No extra secrets needed.

name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: PG-free tests
        run: |
          cargo test -p rustygod-graphql --test schema_sdl
          cargo test -p rustygod-psp
          cargo test -p rustygod-core

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=master-,enable={{is_default_branch}}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=rustygod-saleor
            org.opencontainers.image.description=Saleor commerce engine rewritten in Rust (same PostgreSQL, zero migration)
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
