syntax = "proto3";

package rustygod.payment;

import "common.proto";

// Mirrors saleor/payment TransactionItem + manual gateway actions.
message TransactionInfo {
  string id = 1;
  string token = 2;
  string currency = 3;
  string authorized_amount = 4;
  string charged_amount = 5;
  string refunded_amount = 6;
  string canceled_amount = 7;
  repeated string available_actions = 8;
  string psp_reference = 9;
}

message CreateTransactionRequest {
  string checkout_id = 1;
  string order_id = 2;
  string currency = 3;
  string name = 4;
  string app_identifier = 5;
  string idempotency_key = 6;
}
message CreateTransactionResponse {
  TransactionInfo transaction = 1;
  repeated rustygod.common.Error errors = 2;
}

message GetTransactionRequest { string id = 1; }
message GetTransactionResponse {
  TransactionInfo transaction = 1;
  repeated rustygod.common.Error errors = 2;
}

message GatewayActionRequest {
  string transaction_id = 1;
  string amount = 2;
  string idempotency_key = 3;
  // PSP selector: "manual" (default, sync) | "challenge" (always 3DS) |
  // "async-sim" (pending, settle via PspCallback) | "stripe" (real
  // PaymentIntents HTTP via STRIPE_SECRET_KEY). Unknown → REJECTED.
  string gateway = 4;
  // Where the customer returns after a challenge (3DS return_url).
  string return_url = 5;
  // Gateway-specific JSON (Stripe: {"payment_method":"pm_..."} for
  // authorize/charge, {"payment_intent":"pi_..."} for capture/cancel,
  // {"charge":"ch_..."} or {"payment_intent":"pi_..."} for refunds).
  // Sims ignore it.
  string data = 6;
}
message GatewayActionResponse {
  TransactionInfo transaction = 1;
  repeated rustygod.common.Error errors = 2;
  // True when the PSP demands a customer challenge: redirect them to
  // redirect_url, then settle with PspCallback.
  bool action_required = 3;
  string redirect_url = 4;
}

// Settles a pending request or customer challenge: the PSP's async answer.
message PspCallbackRequest {
  string transaction_id = 1;
  // authorize|charge|refund|cancel — must match the pending request's family.
  string action = 2;
  string psp_reference = 3;
  bool success = 4;
  string message = 5;
  string idempotency_key = 6;
}
message PspCallbackResponse {
  TransactionInfo transaction = 1;
  bool replayed = 2;
  repeated rustygod.common.Error errors = 3;
}

// Django's escape hatch: overwrite authorized without a new success event.
message AdjustAuthorizationRequest {
  string transaction_id = 1;
  string amount = 2;
  string idempotency_key = 3;
}

service PaymentService {
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
  rpc Authorize(GatewayActionRequest) returns (GatewayActionResponse);
  rpc Charge(GatewayActionRequest) returns (GatewayActionResponse);
  rpc Refund(GatewayActionRequest) returns (GatewayActionResponse);
  rpc Cancel(GatewayActionRequest) returns (GatewayActionResponse);
  rpc PspCallback(PspCallbackRequest) returns (PspCallbackResponse);
  rpc AdjustAuthorization(AdjustAuthorizationRequest) returns (GatewayActionResponse);
}
