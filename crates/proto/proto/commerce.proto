syntax = "proto3";

package rustygod.commerce;

import "common.proto";

// ---- Discount (mirrors saleor/discount: voucher + promotion) ----

message VoucherInfo {
  string code = 1;
  string type = 2;
  string discount_value_type = 3;
  string currency = 4;
  string discount_value = 5;
  string min_spent_amount = 6;
  int32 usage_limit = 7;
  int32 used = 8;
}

message ValidateVoucherRequest {
  string code = 1;
  string channel = 2;
}
message ValidateVoucherResponse {
  VoucherInfo voucher = 1;
  repeated rustygod.common.Error errors = 2;
}

message PromotionRuleInfo {
  string id = 1;
  string name = 2;
  string reward_type = 3;
  string reward_value_type = 4;
  string reward_value = 5;
}

message PromotionInfo {
  string id = 1;
  string name = 2;
  string type = 3;
  repeated PromotionRuleInfo rules = 4;
}

message ListPromotionsRequest { string channel = 1; }
message ListPromotionsResponse { repeated PromotionInfo promotions = 1; }

service DiscountService {
  rpc ValidateVoucher(ValidateVoucherRequest) returns (ValidateVoucherResponse);
  rpc ListPromotions(ListPromotionsRequest) returns (ListPromotionsResponse);
}

// ---- Shipping (mirrors saleor/shipping) ----

message ShippingMethodInfo {
  string id = 1;
  string name = 2;
  string type = 3;
  string currency = 4;
  string price_amount = 5;
  string minimum_order_price_amount = 6;
}

message ListShippingMethodsRequest { string channel = 1; }
message ListShippingMethodsResponse { repeated ShippingMethodInfo methods = 1; }

service ShippingService {
  rpc ListShippingMethods(ListShippingMethodsRequest) returns (ListShippingMethodsResponse);
}

// ---- Menu (mirrors saleor/menu, MPTT tree) ----

message MenuItemInfo {
  string id = 1;
  string name = 2;
  string url = 3;
  int32 level = 4;
  repeated MenuItemInfo children = 5;
}

message MenuInfo {
  string id = 1;
  string name = 2;
  string slug = 3;
  repeated MenuItemInfo items = 4;
}

message GetMenuRequest { string slug = 1; }
message GetMenuResponse {
  MenuInfo menu = 1;
  repeated rustygod.common.Error errors = 2;
}

service MenuService {
  rpc GetMenu(GetMenuRequest) returns (GetMenuResponse);
}

// ---- Page/CMS (mirrors saleor/page) ----

message PageInfo {
  string id = 1;
  string slug = 2;
  string title = 3;
  bool is_published = 4;
}

message GetPageRequest { string slug = 1; }
message GetPageResponse {
  PageInfo page = 1;
  repeated rustygod.common.Error errors = 2;
}

message ListPagesRequest {}
message ListPagesResponse { repeated PageInfo pages = 1; }

service PageService {
  rpc GetPage(GetPageRequest) returns (GetPageResponse);
  rpc ListPages(ListPagesRequest) returns (ListPagesResponse);
}

// ---- Account (mirrors saleor/account; never exposes password hashes) ----

message CustomerInfo {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  bool is_active = 5;
}

message GetCustomerRequest { string email = 1; }
message GetCustomerResponse {
  CustomerInfo customer = 1;
  repeated rustygod.common.Error errors = 2;
}

message AddressInput {
  string first_name = 1;
  string last_name = 2;
  string street_address_1 = 3;
  string city = 4;
  string postal_code = 5;
  string country = 6;
  string phone = 7;
}

message CreateAddressResponse {
  string id = 1;
  repeated rustygod.common.Error errors = 2;
}

message GroupInfo {
  string id = 1;
  string name = 2;
  repeated string permissions = 3;
  repeated string member_ids = 4;
}

message CreateGroupRequest {
  string name = 1;
  repeated string permissions = 2;
}
message GroupResponse {
  GroupInfo group = 1;
  repeated rustygod.common.Error errors = 2;
}

message ListGroupsRequest {}
message ListGroupsResponse { repeated GroupInfo groups = 1; }

message RenameGroupRequest {
  string id = 1;
  string name = 2;
}
message DeleteGroupRequest { string id = 1; }
message DeleteGroupResponse {
  bool ok = 1;
  repeated rustygod.common.Error errors = 2;
}

message GroupMembersRequest {
  string id = 1;
  repeated string user_ids = 2;
}
message GroupPermissionsRequest {
  string id = 1;
  repeated string codenames = 2;
}

service AccountService {
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);
  rpc CreateAddress(AddressInput) returns (CreateAddressResponse);
  rpc CreateGroup(CreateGroupRequest) returns (GroupResponse);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc RenameGroup(RenameGroupRequest) returns (GroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
  rpc AddGroupMembers(GroupMembersRequest) returns (GroupResponse);
  rpc RemoveGroupMembers(GroupMembersRequest) returns (GroupResponse);
  rpc GrantGroupPermissions(GroupPermissionsRequest) returns (GroupResponse);
  rpc RevokeGroupPermissions(GroupPermissionsRequest) returns (GroupResponse);
}

// ---- Channel (mirrors saleor/channel) ----

message ChannelInfo {
  string id = 1;
  string slug = 2;
  string currency_code = 3;
  bool is_active = 4;
}

message ListChannelsRequest {}
message ListChannelsResponse { repeated ChannelInfo channels = 1; }
message GetChannelRequest { string slug = 1; }
message GetChannelResponse {
  ChannelInfo channel = 1;
  repeated rustygod.common.Error errors = 2;
}

message CreateChannelRequest {
  string name = 1;
  string slug = 2;
  string currency_code = 3;
  string default_country = 4;
  string allocation_strategy = 5; // empty = Django default
}
message ChannelResponse {
  ChannelInfo channel = 1;
  repeated rustygod.common.Error errors = 2;
}

message UpdateChannelRequest {
  string slug = 1;
  string name = 2;                // empty = unchanged
  bool is_active = 3;
  bool set_active = 4;            // gate for is_active
  string default_country = 5;     // empty = unchanged
  string allocation_strategy = 6; // empty = unchanged
  bool auto_confirm = 7;
  bool set_auto_confirm = 8;      // gate for auto_confirm
}
message DeleteChannelRequest { string slug = 1; }
message DeleteChannelResponse {
  bool ok = 1;
  repeated rustygod.common.Error errors = 2;
}

message SetProductListingRequest {
  string channel = 1;
  string product_id = 2;
  bool is_published = 3;
  bool visible_in_listings = 4;
}
message SetProductListingResponse {
  repeated rustygod.common.Error errors = 1;
}

message SetVariantPriceRequest {
  string channel = 1;
  string variant_id = 2;
  string price = 3;      // decimal string, empty = unchanged
  string cost_price = 4; // decimal string, empty = unchanged
}
message SetVariantPriceResponse {
  repeated rustygod.common.Error errors = 1;
}

service ChannelService {
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse);
  rpc CreateChannel(CreateChannelRequest) returns (ChannelResponse);
  rpc UpdateChannel(UpdateChannelRequest) returns (ChannelResponse);
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);
  rpc SetProductListing(SetProductListingRequest) returns (SetProductListingResponse);
  rpc SetVariantPrice(SetVariantPriceRequest) returns (SetVariantPriceResponse);
}

// ---- Tax (mirrors saleor/tax: classes; rates resolve via plugins) ----

message TaxClassInfo {
  string id = 1;
  string name = 2;
}

message ListTaxClassesRequest {}
message ListTaxClassesResponse { repeated TaxClassInfo classes = 1; }

message GetTaxRateRequest {
  string variant_id = 1; // integer id as string; empty = default rate
  string country = 2;    // ISO code, e.g. DE
  string channel = 3;
}
message GetTaxRateResponse {
  string rate = 1; // percent, e.g. "19"
  bool charge_taxes = 2;
  repeated rustygod.common.Error errors = 3;
}

message TaxLineInput {
  string variant_id = 1;
  string unit_price = 2; // decimal string (channel direction)
  int32 quantity = 3;
}
message TaxedLineInfo {
  string variant_id = 1;
  int32 quantity = 2;
  string unit_net = 3;
  string unit_gross = 4;
  string total_net = 5;
  string total_gross = 6;
  string tax_rate = 7;
}
message CalculateTaxesRequest {
  string channel = 1;
  string country = 2;
  repeated TaxLineInput lines = 3;
}
message CalculateTaxesResponse {
  repeated TaxedLineInfo lines = 1;
  string total_net = 2;
  string total_gross = 3;
  repeated rustygod.common.Error errors = 4;
}

service TaxService {
  rpc ListTaxClasses(ListTaxClassesRequest) returns (ListTaxClassesResponse);
  rpc GetTaxRate(GetTaxRateRequest) returns (GetTaxRateResponse);
  rpc CalculateTaxes(CalculateTaxesRequest) returns (CalculateTaxesResponse);
}

// ---- Warehouse (mirrors saleor/warehouse) ----

message WarehouseInfo {
  string id = 1;
  string name = 2;
  string slug = 3;
  string email = 4;
}

message ListWarehousesRequest { string channel = 1; }
message ListWarehousesResponse { repeated WarehouseInfo warehouses = 1; }

message StockInfo {
  string warehouse_id = 1;
  int32 quantity = 2;
  int32 quantity_allocated = 3;
}

message ListStocksRequest { string variant_id = 1; }
message ListStocksResponse { repeated StockInfo stocks = 1; }

message ReserveStockRequest {
  string variant_id = 1;
  string warehouse_id = 2;
  int32 quantity = 3;
  string checkout_line_id = 4;
  int64 expires_in_seconds = 5;
}
message ReserveStockResponse {
  bool ok = 1;
  repeated rustygod.common.Error errors = 2;
}

message ReleaseReservationRequest { string checkout_line_id = 1; }
message ReleaseReservationResponse { bool ok = 1; }

message CreateWarehouseRequest {
  string name = 1;
  string slug = 2;
  string email = 3;
  string street = 4;
  string city = 5;
  string postal_code = 6;
  string country = 7;
  bool is_private = 8;
  string cc_option = 9; // disabled | local | all
}
message WarehouseResponse {
  WarehouseInfo warehouse = 1;
  repeated rustygod.common.Error errors = 2;
}

message UpdateWarehouseRequest {
  string id = 1;
  string name = 2;      // empty = unchanged
  string email = 3;     // empty = unchanged
  string cc_option = 4; // empty = unchanged
  bool is_private = 5;
  bool set_private = 6; // gate for is_private
}
message DeleteWarehouseRequest { string id = 1; }
message DeleteWarehouseResponse {
  bool ok = 1;
  repeated rustygod.common.Error errors = 2;
}

message UpsertStockRequest {
  string warehouse_id = 1;
  string variant_id = 2;
  int32 quantity = 3;
}
message UpsertStockResponse {
  StockInfo stock = 1;
  repeated rustygod.common.Error errors = 2;
}

message ZoneInfo {
  string id = 1;
  string name = 2;
  string countries = 3;
  bool is_default = 4;
}
message ListZonesRequest {}
message ListZonesResponse { repeated ZoneInfo zones = 1; }

message ZoneLinkRequest {
  string warehouse_id = 1;
  string zone_id = 2;
}
message ZoneLinkResponse {
  bool ok = 1;
  repeated rustygod.common.Error errors = 2;
}

service WarehouseService {
  rpc ListWarehouses(ListWarehousesRequest) returns (ListWarehousesResponse);
  rpc ListStocks(ListStocksRequest) returns (ListStocksResponse);
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);
  rpc CreateWarehouse(CreateWarehouseRequest) returns (WarehouseResponse);
  rpc UpdateWarehouse(UpdateWarehouseRequest) returns (WarehouseResponse);
  rpc DeleteWarehouse(DeleteWarehouseRequest) returns (DeleteWarehouseResponse);
  rpc UpsertStock(UpsertStockRequest) returns (UpsertStockResponse);
  rpc ListZones(ListZonesRequest) returns (ListZonesResponse);
  rpc AssignZone(ZoneLinkRequest) returns (ZoneLinkResponse);
  rpc UnassignZone(ZoneLinkRequest) returns (ZoneLinkResponse);
}
