syntax = "proto3";

package rustygod.order;

import "common.proto";

// Mirrors saleor/order models: Order + OrderLine + Fulfillment.
message OrderLine {
  string variant_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  rustygod.common.Money unit_price = 4;
  rustygod.common.Money total_price = 5;
}

message Order {
  string id = 1;
  string number = 2;
  string channel = 3;
  string email = 4;
  string status = 5;
  repeated OrderLine lines = 6;
  rustygod.common.Money total = 7;
  string currency = 8;
  string created_at = 9;
}

message GetOrderRequest { string id = 1; }
message GetOrderResponse {
  Order order = 1;
  repeated rustygod.common.Error errors = 2;
}

message ReconcileOrderRequest { string id = 1; }
message ReconCheck {
  string name = 1;
  bool ok = 2;
  string detail = 3;
}
message ReconcileOrderResponse {
  repeated ReconCheck checks = 1;
  bool all_ok = 2;
  repeated rustygod.common.Error errors = 3;
}

message CancelOrderRequest { string id = 1; }
message CancelOrderResponse {
  string status = 1;
  repeated rustygod.common.Error errors = 2;
  // Paid cancel settles here (T2): captured money refunded atomically.
  string refunded_amount = 3;
  repeated int32 granted_refund_ids = 4;
}

// Return lines AND refund their money atomically (E7/T2): a `refunded`
// fulfillment (optional restock) + a line-based granted refund executed
// on one transaction. Over-return fails with nothing persisted.
message ReturnLineInput {
  string order_line_id = 1;
  int32 quantity = 2;
  int32 stock_id = 3; // 0 = restore the stock units came from
}
message ReturnOrderLinesRequest {
  string order_id = 1;
  repeated ReturnLineInput lines = 2;
  string reason = 3;
  bool restock = 4;
  int32 transaction_item_id = 5; // 0 = sole charged transaction
}
message ReturnOrderLinesResponse {
  int32 fulfillment_id = 1;
  int32 granted_refund_id = 2;
  string amount = 3;
  repeated rustygod.common.Error errors = 4;
}

// Mirrors saleor OrderGrantRefundCreate: decision first, money on execute.
message GrantRefundLineInput {
  string order_line_id = 1;
  int32 quantity = 2;
}
message CreateGrantedRefundRequest {
  string order_id = 1;
  int32 transaction_item_id = 2; // 0 = none linked
  string amount = 3;             // empty = derive from lines+shipping
  repeated GrantRefundLineInput lines = 4;
  string reason = 5;
  bool shipping_costs_included = 6;
}
message GrantedRefundLineInfo {
  string order_line_id = 1;
  int32 quantity = 2;
}
message CreateGrantedRefundResponse {
  int32 granted_refund_id = 1;
  string amount = 2;
  string status = 3;
  repeated GrantedRefundLineInfo lines = 4;
  repeated rustygod.common.Error errors = 5;
}
message ExecuteGrantedRefundRequest {
  int32 granted_refund_id = 1;
  string idempotency_key = 2;
}
message ExecuteGrantedRefundResponse {
  string status = 1;
  bool replayed = 2;
  repeated rustygod.common.Error errors = 3;
}
message GetGrantedRefundRequest { int32 granted_refund_id = 1; }
message GetGrantedRefundResponse {
  int32 granted_refund_id = 1;
  string order_id = 2;
  string amount = 3;
  string status = 4;
  string reason = 5;
  repeated GrantedRefundLineInfo lines = 6;
  repeated rustygod.common.Error errors = 7;
}

message ListOrdersRequest {
  int32 first = 1;
  string after = 2;
  string status = 3;
}
message ListOrdersResponse {
  repeated Order orders = 1;
  rustygod.common.PageInfo page_info = 2;
}

service OrderService {
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc CreateFulfillment(CreateFulfillmentRequest) returns (FulfillmentResponse);
  rpc CancelFulfillment(CancelFulfillmentRequest) returns (FulfillmentResponse);
  rpc RefundFulfillment(RefundFulfillmentRequest) returns (FulfillmentResponse);
  rpc ListFulfillments(ListFulfillmentsRequest) returns (ListFulfillmentsResponse);
  rpc ReconcileOrder(ReconcileOrderRequest) returns (ReconcileOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc ReturnOrderLines(ReturnOrderLinesRequest) returns (ReturnOrderLinesResponse);
  rpc CreateGrantedRefund(CreateGrantedRefundRequest) returns (CreateGrantedRefundResponse);
  rpc ExecuteGrantedRefund(ExecuteGrantedRefundRequest) returns (ExecuteGrantedRefundResponse);
  rpc GetGrantedRefund(GetGrantedRefundRequest) returns (GetGrantedRefundResponse);
}

// Mirrors saleor/order fulfillments: fulfillment_order auto-increments,
// lines cap at the unfulfilled remainder, stock moves with the lines.
message FulfillLineInput {
  string order_line_id = 1;
  int32 quantity = 2;
  string stock_id = 3;
}

message FulfillmentLineInfo {
  string order_line_id = 1;
  int32 quantity = 2;
  string stock_id = 3;
}

message FulfillmentInfo {
  string id = 1;
  string order_id = 2;
  int32 fulfillment_order = 3;
  string status = 4;
  string tracking_number = 5;
  repeated FulfillmentLineInfo lines = 6;
}

message CreateFulfillmentRequest {
  string order_id = 1;
  repeated FulfillLineInput lines = 2;
  string tracking_number = 3;
}

message CancelFulfillmentRequest { string fulfillment_id = 1; }

message RefundFulfillmentRequest {
  string order_id = 1;
  repeated FulfillLineInput lines = 2;
  string reason = 3;
}

message FulfillmentResponse {
  FulfillmentInfo fulfillment = 1;
  repeated rustygod.common.Error errors = 2;
}

message ListFulfillmentsRequest { string order_id = 1; }
message ListFulfillmentsResponse { repeated FulfillmentInfo fulfillments = 1; }
