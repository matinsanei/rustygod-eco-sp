syntax = "proto3";

package rustygod.common;

// Money mirrors saleor's Money: decimal amount as string (no float), ISO currency.
message Money {
  string currency = 1;
  string amount = 2;
}

message PageInfo {
  bool has_next_page = 1;
  string end_cursor = 2;
}

message Error {
  string code = 1;
  string message = 2;
  string field = 3;
}
