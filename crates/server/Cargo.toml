[package]
name = "saleor-rustify-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "saleor-rustify"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tonic = { workspace = true }
rust_decimal = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
saleor-rustify-proto = { path = "../proto" }
saleor-rustify-core = { path = "../core" }
saleor-rustify-db = { path = "../db" }
saleor-rustify-ai = { path = "../ai" }
saleor-rustify-plugins = { path = "../plugins" }
saleor-rustify-graphql = { path = "../graphql" }
saleor-rustify-psp = { path = "../psp" }
async-graphql = { version = "7", features = ["chrono", "uuid", "decimal"] }
async-graphql-axum = "7"
axum = { version = "0.7", features = ["json"] }
sea-orm = { workspace = true }
tokio-stream = { workspace = true }
tower-http = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tonic = { workspace = true }
fs2 = { workspace = true }
sea-orm = { workspace = true }
uuid = { workspace = true }
